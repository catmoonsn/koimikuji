<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青春みくじ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-pattern"></div>

  <div class="container">

    <div id="omikuji" class="omikuji">

      <!-- 中身 -->
      <div class="inside">

        <h1>青春みくじ</h1>

        <div class="result-area">

          <div class="section">

            <div class="label">
              運勢
            </div>

            <div id="fortune" class="fortune">
            </div>

          </div>

          <div class="section">

            <div class="label">
              ラッキー行動
            </div>

            <div id="action" class="value">
            </div>

          </div>

          <div class="section">

            <div class="label">
              一言
            </div>

            <div id="messageText" class="value">
            </div>

          </div>

        </div>

      </div>

      <!-- 表紙 -->

      <div class="cover">

        <div class="seal">
          青
        </div>

        <div class="cover-text">

          <p>
            青春みくじ
          </p>

          <span>
            タップして開く
          </span>

        </div>

      </div>

    </div>

  </div>

  <div id="message" class="message"></div>

  <script src="script.js"></script>

</body>
</html>
